<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>させ34‼️ | FESTIVAL RACE</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:#063d28;
  color:#fff;
}

header{
  background:#082c20;
  padding:15px;
  text-align:center;
  border-bottom:4px solid #d4af37;
}

.small{
  font-size:12px;
  letter-spacing:2px;
}

h1{
  margin:5px 0;
  font-size:30px;
  color:#ffd84d;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.race-title{
  background:#d4af37;
  color:#10291e;
  padding:15px;
  border-radius:10px;
  text-align:center;
  font-weight:bold;
  margin-bottom:15px;
}

.live{
  color:#ff5a5a;
  font-weight:bold;
}

.status{
  text-align:center;
  padding:12px;
  background:#0d5438;
  border-radius:8px;
  margin-bottom:15px;
}

.horse{
  background:#fff;
  color:#222;
  border-radius:12px;
  margin:12px 0;
  padding:15px;
  box-shadow:0 4px 12px #0005;
}

.horse-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.number{
  background:#111;
  color:#ffd84d;
  padding:6px 10px;
  border-radius:6px;
  font-weight:bold;
}

.name{
  font-size:20px;
  font-weight:bold;
  margin-left:10px;
}

.rate{
  font-size:22px;
  font-weight:bold;
  color:#08753d;
}

.vote-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#08753d;
  color:white;
  font-size:17px;
  font-weight:bold;
}

.vote-btn:disabled{
  background:#999;
}

.ranking{
  margin-top:25px;
  background:#fff;
  color:#222;
  border-radius:12px;
  padding:18px;
}

.rank{
  display:flex;
  justify-content:space-between;
  padding:12px 5px;
  border-bottom:1px solid #ddd;
}

.rank:last-child{
  border-bottom:0;
}

.rank-number{
  font-weight:bold;
  color:#08753d;
}

.notice{
  margin-top:20px;
  padding:14px;
  background:#fff3cd;
  color:#664d03;
  border-radius:8px;
  font-size:13px;
  line-height:1.6;
}
</style>
</head>

<body>

<header>
  <div class="small">SCHOOL FESTIVAL 2026</div>
  <h1>🐎 させ34‼️</h1>
  <div class="small">SASE34 FESTIVAL RACE</div>
</header>

<div class="container">

  <div class="race-title">
    第34回 文化祭記念<br>
    <span class="live">● LIVE</span>
  </div>

  <div id="status" class="status">
    Firebaseに接続しています…
  </div>

  <div id="horses"></div>

  <div class="ranking">
    <h2>🏆 人気ランキング</h2>
    <div id="ranking"></div>
  </div>

  <div class="notice">
    この企画は文化祭内で行う無料の人気投票です。<br>
    お金を賭けたり、賞金を受け取ったりするものではありません。
  </div>

</div>

<script>

// =========================
// Firebase設定
// =========================

const firebaseConfig = {
  apiKey: "AIzaSyDq54jr0rMRmc--F1ZEPqa9cyMbtGmFkUQ",
  authDomain: "sase34-9cebc.firebaseapp.com",
  projectId: "sase34-9cebc",
  storageBucket: "sase34-9cebc.firebasestorage.app",
  messagingSenderId: "507211802803",
  appId: "1:507211802803:web:d804fef0ed4aeded9ba8c6"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


// =========================
// エントリー
// =========================

const horses = [
  {id:"01", name:"エントリー1", rate:34},
  {id:"02", name:"エントリー2", rate:15},
  {id:"03", name:"エントリー3", rate:21},
  {id:"04", name:"エントリー4", rate:18},
  {id:"05", name:"エントリー5", rate:30}
];

let currentUser = null;
let voteData = {};


// =========================
// 画面表示
// =========================

function renderHorses(){

  const area = document.getElementById("horses");

  area.innerHTML = horses.map(horse => `
    <div class="horse">

      <div class="horse-top">

        <div>
          <span class="number">${horse.id}</span>
          <span class="name">${horse.name}</span>
        </div>

        <div class="rate">
          ${horse.rate}%
        </div>

      </div>

      <button
        class="vote-btn"
        onclick="vote('${horse.id}', this)"
      >
        このエントリーに投票
      </button>

    </div>
  `).join("");

}

renderHorses();


// =========================
// Firebase匿名ログイン
// =========================

auth.signInAnonymously()
.then(userCredential => {

  currentUser = userCredential.user;

  document.getElementById("status").innerHTML =
    "🟢 接続OK！投票できます";

  checkMyVote();

})
.catch(error => {

  console.error(error);

  document.getElementById("status").innerHTML =
    "🔴 Firebaseへの接続に失敗しました";

});


// =========================
// 自分が投票済みか確認
// =========================

async function checkMyVote(){

  if(!currentUser) return;

  try{

    const snapshot = await db
      .collection("races")
      .doc("festival2026")
      .collection("votes")
      .doc(currentUser.uid)
      .get();

    if(snapshot.exists){

      disableButtons();

      document.getElementById("status").innerHTML =
        "✅ 投票済みです！結果を確認できます";

    }

  }catch(error){

    console.error(error);

  }

}


// =========================
// 投票
// =========================

async function vote(horseId, button){

  if(!currentUser){
    alert("接続中です。少し待ってください！");
    return;
  }

  button.disabled = true;
  button.textContent = "投票中…";

  try{

    const voteRef = db
      .collection("races")
      .doc("festival2026")
      .collection("votes")
      .doc(currentUser.uid);

    const existing = await voteRef.get();

    if(existing.exists){

      alert("この端末ではすでに投票しています。");

      disableButtons();

      return;
    }

    await voteRef.set({

      horseId: horseId,

      createdAt: firebase.firestore.FieldValue.serverTimestamp()

    });

    disableButtons();

    document.getElementById("status").innerHTML =
      "🎉 投票完了！ありがとうございました！";

    loadVotes();

  }catch(error){

    console.error(error);

    button.disabled = false;
    button.textContent = "このエントリーに投票";

    alert("投票に失敗しました。もう一度試してください。");

  }

}


// =========================
// 投票ボタンを無効化
// =========================

function disableButtons(){

  document.querySelectorAll(".vote-btn").forEach(button => {

    button.disabled = true;
    button.textContent = "投票済み";

  });

}


// =========================
// 投票結果を読み込む
// =========================

async function loadVotes(){

  try{

    const snapshot = await db
      .collection("races")
      .doc("festival2026")
      .collection("votes")
      .get();

    voteData = {};

    horses.forEach(horse => {
      voteData[horse.id] = 0;
    });

    snapshot.forEach(doc => {

      const data = doc.data();

      if(voteData[data.horseId] !== undefined){

        voteData[data.horseId]++;

      }

    });

    renderRanking();

  }catch(error){

    console.error(error);

  }

}


// =========================
// ランキング
// =========================

function renderRanking(){

  const sorted = [...horses].sort(
    (a,b) => (voteData[b.id] || 0) - (voteData[a.id] || 0)
  );

  document.getElementById("ranking").innerHTML =
    sorted.map((horse,index) => `

      <div class="rank">

        <span>
          <span class="rank-number">
            ${index + 1}位
          </span>
         　${horse.name}
        </span>

        <strong>
          ${voteData[horse.id] || 0}票
        </strong>

      </div>

    `).join("");

}


// 最初に結果を読み込む
loadVotes();

</script>

</body>
</html>
