<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOKKYO RACE</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  color:#fff;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at top,#1b743e 0%,#073b20 40%,#01150a 100%);
  min-height:100vh;
}

/* HEADER */

.header{
  text-align:center;
  padding:15px 10px 13px;
  background:linear-gradient(180deg,#142d1c,#06140c);
  border-bottom:4px solid #d8b64c;
  box-shadow:0 5px 20px #0009;
}

.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:#080808;
  border:1px solid #555;
  border-radius:20px;
  padding:5px 12px;
  font-size:12px;
  font-weight:bold;
}

.live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff1515;
  box-shadow:0 0 10px red;
  animation:blink 1s infinite;
}

@keyframes blink{
  0%,45%{opacity:1}
  50%,100%{opacity:.2}
}

.logo{
  margin-top:7px;
  font-size:42px;
  font-weight:1000;
  letter-spacing:4px;
  color:#f5d86b;
  text-shadow:
    0 2px 0 #765900,
    0 0 17px #ffd84d77;
}

.subtitle{
  font-size:14px;
  color:#ddd;
  margin-top:3px;
}

.status{
  display:inline-block;
  margin-top:9px;
  padding:5px 12px;
  border-radius:20px;
  background:#102419;
  border:1px solid #31543c;
  font-size:11px;
}

/* NAV */

.nav{
  position:sticky;
  top:0;
  z-index:100;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  background:#06140b;
  border-bottom:2px solid #5e6d42;
  box-shadow:0 4px 12px #0008;
}

.nav button{
  border:0;
  border-right:1px solid #29432e;
  background:#0a1d10;
  color:#aebaae;
  padding:12px 4px;
  font-size:11px;
  font-weight:bold;
  cursor:pointer;
}

.nav button:last-child{
  border-right:0;
}

.nav button.active{
  background:linear-gradient(180deg,#876d23,#514314);
  color:#fff;
  box-shadow:inset 0 -3px #ffe16a;
}

/* MAIN */

.main{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:15px 10px 40px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.notice{
  text-align:center;
  background:linear-gradient(90deg,#741d13,#b63d18,#741d13);
  border:2px solid #e6bd4e;
  border-radius:9px;
  padding:9px;
  font-size:13px;
  font-weight:bold;
  box-shadow:0 4px 15px #0008;
  margin-bottom:14px;
}

.section-title{
  background:linear-gradient(90deg,#182d1d,#08170d);
  border-left:5px solid #dfba4b;
  padding:10px 12px;
  font-size:18px;
  font-weight:1000;
  margin-bottom:9px;
}

/* HORSES */

.horse-board{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.horse-card{
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#174d2a,#082416);
  border:1px solid #4c7655;
  border-radius:9px;
  box-shadow:0 5px 15px #0008;
  padding-bottom:10px;
}

.horse-number{
  position:absolute;
  z-index:5;
  top:7px;
  left:7px;
  width:28px;
  height:28px;
  border-radius:5px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:1000;
  color:#111;
}

.n1{background:#fff}
.n2{background:#111;color:#fff}
.n3{background:#e33;color:#fff}
.n4{background:#4388ef;color:#fff}
.n5{background:#f1dc3d}

.horse-picture{
  position:relative;
  height:115px;
  overflow:hidden;
  background:linear-gradient(180deg,#236a3a,#0b301a);
  border-bottom:1px solid #446b4d;
}

.big-horse{
  position:absolute;
  left:-65px;
  bottom:2px;
  font-size:53px;
  animation:run 4.8s linear infinite;
  filter:drop-shadow(0 3px 2px #0009);
}

.big-horse span{
  display:inline-block;
  transform:scaleX(-1);
}

.horse-card:nth-child(2) .big-horse{
  animation-delay:-1s;
}

.horse-card:nth-child(3) .big-horse{
  animation-delay:-2s;
}

.horse-card:nth-child(4) .big-horse{
  animation-delay:-3s;
}

.horse-card:nth-child(5) .big-horse{
  animation-delay:-4s;
}

@keyframes run{
  0%{left:-65px}
  100%{left:calc(100% + 10px)}
}

.horse-name{
  padding:8px 4px 2px;
  text-align:center;
  font-size:14px;
  font-weight:1000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.entry{
  text-align:center;
  color:#91ad98;
  font-size:9px;
}

.win{
  margin:7px 8px 0;
  padding:6px 3px;
  text-align:center;
  background:#06150b;
  border:1px solid #385b40;
  border-radius:6px;
}

.win-label{
  display:block;
  color:#bbb;
  font-size:9px;
}

.win-rate{
  display:block;
  color:#ffdc50;
  font-size:25px;
  font-weight:1000;
}

/* RANKING */

.ranking-box{
  background:linear-gradient(135deg,#12351f,#07190e);
  border:1px solid #4c7655;
  border-radius:10px;
  padding:10px;
  box-shadow:0 5px 17px #0008;
}

.rank-row{
  display:grid;
  grid-template-columns:50px 1fr 80px;
  align-items:center;
  min-height:55px;
  border-bottom:1px solid #203e29;
}

.rank-row:last-child{
  border-bottom:0;
}

.rank-position{
  text-align:center;
  font-size:22px;
  font-weight:1000;
}

.rank-name{
  font-weight:bold;
}

.rank-rate{
  text-align:right;
  color:#ffd84d;
  font-size:21px;
  font-weight:1000;
}

.rank-bar{
  grid-column:2 / 4;
  height:5px;
  margin:0 0 7px;
  background:#06130a;
  border-radius:10px;
  overflow:hidden;
}

.rank-bar-inner{
  height:100%;
  background:linear-gradient(90deg,#b68c24,#ffe77b);
}

/* VOTE */

.vote-box{
  display:grid;
  gap:9px;
}

.vote-card{
  display:grid;
  grid-template-columns:45px 1fr 90px;
  align-items:center;
  gap:10px;
  background:linear-gradient(135deg,#12351f,#07190e);
  border:1px solid #41684a;
  border-radius:9px;
  padding:10px;
}

.vote-number{
  width:36px;
  height:36px;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#111;
  font-weight:1000;
}

.vote-name{
  font-weight:1000;
  font-size:15px;
}

.vote-sub{
  color:#91ad98;
  font-size:10px;
  margin-top:2px;
}

.vote-button{
  border:0;
  border-radius:6px;
  padding:9px 5px;
  background:linear-gradient(180deg,#ffe477,#d2a331);
  color:#111;
  font-size:11px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 3px 0 #725615;
}

.vote-button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.my-vote{
  display:none;
  margin-top:10px;
  text-align:center;
  padding:11px;
  background:#173d22;
  border:1px solid #4f895b;
  border-radius:8px;
  font-weight:bold;
}

/* RESULTS */

.total{
  text-align:center;
  padding:14px;
  background:#0a2112;
  border:1px solid #426b4c;
  border-radius:9px;
  margin-bottom:10px;
}

.total-label{
  color:#aaa;
  font-size:12px;
}

.total-number{
  font-size:32px;
  font-weight:1000;
  color:#ffd84d;
}

.result-row{
  display:grid;
  grid-template-columns:50px 1fr 90px;
  align-items:center;
  gap:10px;
  background:#0b2113;
  border:1px solid #365b40;
  border-radius:8px;
  padding:10px;
  margin-bottom:7px;
}

.result-rank{
  text-align:center;
  font-size:22px;
  font-weight:1000;
}

.result-name{
  font-weight:bold;
}

.result-votes{
  text-align:right;
  color:#ffd84d;
  font-weight:1000;
  font-size:18px;
}

.result-bar{
  grid-column:2 / 4;
  height:8px;
  background:#06130a;
  border-radius:10px;
  overflow:hidden;
}

.result-bar-inner{
  height:100%;
  background:linear-gradient(90deg,#a67e24,#ffe477);
  width:0%;
  transition:width .5s;
}

.error{
  display:none;
  margin-top:10px;
  padding:11px;
  background:#551c1c;
  border:1px solid #ff6868;
  border-radius:8px;
  color:#ffdada;
  font-size:12px;
  line-height:1.5;
}

.footer{
  text-align:center;
  margin-top:25px;
  color:#78927f;
  font-size:10px;
  line-height:1.7;
}

/* MOBILE */

@media(max-width:700px){

  .logo{
    font-size:31px;
    letter-spacing:2px;
  }

  .horse-board{
    grid-template-columns:repeat(5,150px);
    overflow-x:auto;
    padding-bottom:8px;
  }

  .horse-card{
    width:150px;
  }

  .nav button{
    font-size:10px;
    padding:11px 2px;
  }

  .vote-card{
    grid-template-columns:40px 1fr 85px;
  }

}

</style>
</head>


<body>


<!-- HEADER -->

<header class="header">

  <div class="live">
    <span class="live-dot"></span>
    LIVE
  </div>

  <div class="logo">
    DOKKYO RACE
  </div>

  <div class="subtitle">
    学園祭スペシャル・単勝予想
  </div>

  <div class="status" id="firebaseStatus">
    🔄 Firebase接続中...
  </div>

</header>


<!-- NAV -->

<nav class="nav">

  <button
    id="nav-horses"
    class="active"
    onclick="showPage('horses')"
  >
    🏇<br>出走馬
  </button>

  <button
    id="nav-win"
    onclick="showPage('win')"
  >
    📊<br>勝率
  </button>

  <button
    id="nav-vote"
    onclick="showPage('vote')"
  >
    🎫<br>投票
  </button>

  <button
    id="nav-result"
    onclick="showPage('result')"
  >
    📈<br>投票結果
  </button>

</nav>


<main class="main">


<!-- =========================
     PAGE 1 出走馬
========================= -->

<section
  id="page-horses"
  class="page active"
>

  <div class="notice">
    🏇 DOKKYO RACE 学園祭スペシャル
  </div>

  <div class="section-title">
    🏇 出走馬
  </div>

  <div
    class="horse-board"
    id="horseBoard"
  ></div>

</section>


<!-- =========================
     PAGE 2 勝率
========================= -->

<section
  id="page-win"
  class="page"
>

  <div class="notice">
    📊 DOKKYO RACE 勝率ランキング
  </div>

  <div class="section-title">
    📊 勝率ランキング
  </div>

  <div class="ranking-box">

    <div id="ranking"></div>

  </div>

  <div class="footer">
    ※勝率は演出用の固定表示です。投票結果とは連動しません。
  </div>

</section>


<!-- =========================
     PAGE 3 投票
========================= -->

<section
  id="page-vote"
  class="page"
>

  <div class="notice">
    🎫 お金を使わない無料の人気投票です。1端末につき1票まで。
  </div>

  <div class="section-title">
    🎫 エントリーを選択
  </div>

  <div
    class="vote-box"
    id="voteBox"
  ></div>

  <div
    class="my-vote"
    id="myVote"
  ></div>

  <div
    class="error"
    id="errorBox"
  ></div>

</section>


<!-- =========================
     PAGE 4 投票結果
========================= -->

<section
  id="page-result"
  class="page"
>

  <div class="notice">
    📈 現在の投票状況
  </div>

  <div class="total">

    <div class="total-label">
      TOTAL VOTES
    </div>

    <div
      class="total-number"
      id="totalVotes"
    >
      0
    </div>

    <div class="total-label">
      票
    </div>

  </div>

  <div class="section-title">
    📈 投票結果ランキング
  </div>

  <div id="results"></div>

</section>


<div class="footer">

  DOKKYO RACE / SCHOOL FESTIVAL SPECIAL<br>

  ※文化祭で実施する無料の人気投票です。

</div>


</main>


<script>

/* ==========================================
   Firebase
========================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDq54jr0rMRmc--F1ZEPqa9cyMbtGmFkUQ",
  authDomain: "sase34-9cebc.firebaseapp.com",
  projectId: "sase34-9cebc",
  storageBucket: "sase34-9cebc.firebasestorage.app",
  messagingSenderId: "507211802803",
  appId: "1:507211802803:web:d804fef0ed4aeded9ba8c6"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* ==========================================
   出走馬
   ★ 表示順はあえてバラバラ
========================================== */

const horses = [

  {
    id:"3",
    name:"グリーンフラッシュ",
    win:19
  },

  {
    id:"1",
    name:"オレンジスター",
    win:32
  },

  {
    id:"5",
    name:"アサクサダッシュ",
    win:10
  },

  {
    id:"2",
    name:"ロイヤルポニー",
    win:25
  },

  {
    id:"4",
    name:"ビッくらサンダー",
    win:14
  }

];


/* 勝率ランキング用 */

const winRanking = [

  {
    id:"1",
    name:"オレンジスター",
    win:32
  },

  {
    id:"2",
    name:"ロイヤルポニー",
    win:25
  },

  {
    id:"3",
    name:"グリーンフラッシュ",
    win:19
  },

  {
    id:"4",
    name:"ビッくらサンダー",
    win:14
  },

  {
    id:"5",
    name:"アサクサダッシュ",
    win:10
  }

];


let currentUser = null;
let votes = {};
let myVote = null;


/* ==========================================
   ページ切り替え
========================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(el=>{
      el.classList.remove("active");
    });

  document
    .getElementById("page-"+page)
    .classList.add("active");


  document
    .querySelectorAll(".nav button")
    .forEach(el=>{
      el.classList.remove("active");
    });

  document
    .getElementById("nav-"+page)
    .classList.add("active");


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==========================================
   出走馬
========================================== */

function renderHorses(){

  const board =
    document.getElementById("horseBoard");

  board.innerHTML = "";

  horses.forEach((horse,index)=>{

    board.innerHTML += `

      <div class="horse-card">

        <div class="horse-number n${horse.id}">
          ${horse.id}
        </div>

        <div class="horse-picture">

          <div class="big-horse">
            <span>🐎</span>
          </div>

        </div>

        <div class="horse-name">
          ${horse.name}
        </div>

        <div class="entry">
          ENTRY No.${horse.id}
        </div>

        <div class="win">

          <span class="win-label">
            勝率
          </span>

          <span class="win-rate">
            ${horse.win}%
          </span>

        </div>

      </div>

    `;

  });

}


/* ==========================================
   勝率ランキング
========================================== */

function renderWinRanking(){

  const ranking =
    document.getElementById("ranking");

  ranking.innerHTML = "";

  winRanking.forEach((horse,index)=>{

    ranking.innerHTML += `

      <div class="rank-row">

        <div class="rank-position">
          ${index+1}
        </div>

        <div class="rank-name">
          ${horse.name}
        </div>

        <div class="rank-rate">
          ${horse.win}%
        </div>

        <div class="rank-bar">

          <div
            class="rank-bar-inner"
            style="width:${horse.win}%"
          ></div>

        </div>

      </div>

    `;

  });

}


/* ==========================================
   投票ページ
========================================== */

function renderVotePage(){

  const box =
    document.getElementById("voteBox");

  box.innerHTML = "";

  /*
    投票ページも出走順と同じ
    3 → 1 → 5 → 2 → 4
  */

  horses.forEach(horse=>{

    box.innerHTML += `

      <div class="vote-card">

        <div class="vote-number n${horse.id}">
          ${horse.id}
        </div>

        <div>

          <div class="vote-name">
            ${horse.name}
          </div>

          <div class="vote-sub">
            ENTRY No.${horse.id}
          </div>

        </div>

        <button
          class="vote-button"
          id="button-${horse.id}"
          onclick="vote('${horse.id}')"
        >
          投票する
        </button>

      </div>

    `;

  });

  updateButtons();

}


/* ==========================================
   ボタン状態
========================================== */

function updateButtons(){

  horses.forEach(horse=>{

    const button =
      document.getElementById(
        "button-"+horse.id
      );

    if(!button) return;

    if(myVote){

      button.disabled = true;

      if(myVote === horse.id){

        button.textContent =
          "✓ 投票済み";

      }else{

        button.textContent =
          "投票済み";

      }

    }else{

      button.disabled = false;

      button.textContent =
        "投票する";

    }

  });

}


/* ==========================================
   投票
========================================== */

async function vote(horseId){

  if(!currentUser){

    showError(
      "Firebase認証がまだ完了していません。少し待ってください。"
    );

    return;
  }

  if(myVote){

    alert(
      "この端末ではすでに投票済みです！"
    );

    return;
  }

  try{

    const ref =
      db
      .collection("races")
      .doc("festival2026")
      .collection("votes_v2")
      .doc(currentUser.uid);

    await ref.set({

      horseId:horseId,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    myVote =
      horseId;

    updateButtons();

    const horse =
      horses.find(h=>h.id===horseId);

    const box =
      document.getElementById("myVote");

    box.style.display =
      "block";

    box.textContent =
      `🎉 ${horse.name} に投票しました！`;

  }catch(error){

    console.error(error);

    showError(
      "投票できませんでした。Firestore RulesがPublishされているか確認してください。"
    );

  }

}


/* ==========================================
   Firebase認証
========================================== */

async function startFirebase(){

  const status =
    document.getElementById(
      "firebaseStatus"
    );

  try{

    status.textContent =
      "🔄 Firebase認証中...";


    if(!auth.currentUser){

      await auth.signInAnonymously();

    }


    currentUser =
      auth.currentUser;


    if(!currentUser){

      throw new Error(
        "匿名ユーザーを取得できませんでした"
      );

    }


    status.textContent =
      "🟢 Firebase ONLINE";

    status.style.color =
      "#7dff9b";


    startVoteListener();

  }catch(error){

    console.error(error);

    status.textContent =
      "🔴 Firebase接続エラー";

    status.style.color =
      "#ff7777";

    showError(
      "Firebaseに接続できませんでした。Authenticationの匿名ログインとAuthorized domainsを確認してください。"
    );

  }

}


/* ==========================================
   投票データ監視
========================================== */

function startVoteListener(){

  db
  .collection("races")
  .doc("festival2026")
  .collection("votes_v2")
  .onSnapshot(

    snapshot=>{

      votes = {};

      snapshot.forEach(doc=>{

        const data =
          doc.data();

        if(data.horseId){

          votes[data.horseId] =
            (votes[data.horseId] || 0) + 1;

        }

      });


      renderResults();

    },

    error=>{

      console.error(error);

      const status =
        document.getElementById(
          "firebaseStatus"
        );

      status.textContent =
        "🔴 Firestoreエラー";

      status.style.color =
        "#ff7777";

      showError(
        "Firestoreの読み込みに失敗しました。Firestore RulesをPublishしてください。"
      );

    }

  );


  /*
    自分が投票済みか確認
  */

  db
  .collection("races")
  .doc("festival2026")
  .collection("votes_v2")
  .doc(currentUser.uid)
  .get()

  .then(doc=>{

    if(doc.exists){

      const data =
        doc.data();

      myVote =
        data.horseId;

      const horse =
        horses.find(
          h=>h.id===myVote
        );

      if(horse){

        const box =
          document.getElementById(
            "myVote"
          );

        box.style.display =
          "block";

        box.textContent =
          `✓ ${horse.name} に投票済みです`;

      }

      updateButtons();

    }

  })

  .catch(error=>{

    console.error(error);

  });

}


/* ==========================================
   投票結果
========================================== */

function renderResults(){

  const results =
    document.getElementById(
      "results"
    );

  const totalVotes =
    Object.values(votes)
      .reduce(
        (sum,value)=>sum+value,
        0
      );


  document.getElementById(
    "totalVotes"
  ).textContent =
    totalVotes;


  /*
    投票数の多い順
  */

  const sorted =
    [...horses].sort(
      (a,b)=>
        (votes[b.id]||0) -
        (votes[a.id]||0)
    );


  results.innerHTML = "";


  sorted.forEach((horse,index)=>{

    const count =
      votes[horse.id] || 0;

    const percent =
      totalVotes === 0
      ? 0
      : Math.round(
          count / totalVotes * 100
        );


    results.innerHTML += `

      <div class="result-row">

        <div class="result-rank">
          ${index+1}
        </div>

        <div class="result-name">
          ${horse.name}
        </div>

        <div class="result-votes">
          ${count}票
        </div>

        <div class="result-bar">

          <div
            class="result-bar-inner"
            style="width:${percent}%"
          ></div>

        </div>

      </div>

    `;

  });

}


/* ==========================================
   エラー
========================================== */

function showError(message){

  const box =
    document.getElementById(
      "errorBox"
    );

  box.style.display =
    "block";

  box.textContent =
    "⚠️ " + message;

}


/* ==========================================
   起動
========================================== */

renderHorses();

renderWinRanking();

renderVotePage();

renderResults();

startFirebase();

</script>
