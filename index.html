<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOKKYO RACE</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans JP",sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at top,#19703b 0%,#073a20 38%,#01150a 100%);
  min-height:100vh;
}

.header{
  background:linear-gradient(180deg,#142d1d,#06140c);
  border-bottom:4px solid #d7b348;
  text-align:center;
  padding:16px 12px 13px;
  box-shadow:0 5px 20px #0009;
}

.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:#080808;
  border:1px solid #555;
  border-radius:20px;
  padding:5px 12px;
  font-size:12px;
  font-weight:bold;
}

.live-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff1717;
  box-shadow:0 0 10px red;
  animation:liveblink 1s infinite;
}

@keyframes liveblink{
  0%,45%{opacity:1}
  50%,100%{opacity:.2}
}

.logo{
  margin-top:7px;
  font-size:42px;
  font-weight:1000;
  letter-spacing:4px;
  color:#f3d568;
  text-shadow:
    0 2px 0 #765800,
    0 0 16px #ffd84d77;
}

.subtitle{
  margin-top:3px;
  color:#ddd;
  font-size:14px;
}

.status{
  display:inline-block;
  margin-top:9px;
  padding:5px 12px;
  border-radius:20px;
  background:#102419;
  border:1px solid #31543c;
  font-size:11px;
}

.main{
  width:100%;
  max-width:1000px;
  margin:auto;
  padding:16px 10px 40px;
}

.notice{
  text-align:center;
  background:linear-gradient(90deg,#741d13,#b63d18,#741d13);
  border:2px solid #e5bb4b;
  border-radius:9px;
  padding:9px;
  font-size:13px;
  font-weight:bold;
  box-shadow:0 4px 15px #0008;
}

/* =========================
   出走馬
========================= */

.section-title{
  margin-top:16px;
  background:linear-gradient(90deg,#182c1d,#09160d);
  border-left:5px solid #dfba4a;
  padding:10px 12px;
  font-size:18px;
  font-weight:1000;
}

.horse-board{
  margin-top:8px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.horse-card{
  position:relative;
  min-width:0;
  background:
    linear-gradient(180deg,#174b29,#082416);
  border:1px solid #4c7655;
  border-radius:9px;
  overflow:hidden;
  box-shadow:0 5px 15px #0008;
  padding-bottom:10px;
}

.horse-number{
  position:absolute;
  top:7px;
  left:7px;
  width:28px;
  height:28px;
  border-radius:5px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:1000;
  color:#111;
  z-index:5;
}

.n1{background:#fff}
.n2{background:#111;color:#fff}
.n3{background:#e63c3c;color:#fff}
.n4{background:#4388ef;color:#fff}
.n5{background:#f2dc3d}

.horse-picture{
  height:110px;
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(180deg,#1e6035,#0b301a);
  border-bottom:1px solid #446b4d;
}

.big-horse{
  position:absolute;
  left:-55px;
  bottom:3px;
  font-size:52px;
  animation:horseRun 4.7s linear infinite;
  filter:drop-shadow(0 3px 2px #0009);
}

.big-horse span{
  display:inline-block;
  transform:scaleX(-1);
}

.horse-card:nth-child(2) .big-horse{
  animation-delay:-1s;
}

.horse-card:nth-child(3) .big-horse{
  animation-delay:-2s;
}

.horse-card:nth-child(4) .big-horse{
  animation-delay:-3s;
}

.horse-card:nth-child(5) .big-horse{
  animation-delay:-4s;
}

@keyframes horseRun{
  0%{left:-65px}
  100%{left:calc(100% + 10px)}
}

.horse-name{
  padding:8px 5px 2px;
  text-align:center;
  font-size:14px;
  font-weight:1000;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.entry{
  text-align:center;
  font-size:9px;
  color:#94b39b;
}

.win{
  margin:7px 8px 0;
  padding:6px 4px;
  background:#06150b;
  border:1px solid #385b40;
  border-radius:6px;
  text-align:center;
}

.win-label{
  display:block;
  font-size:9px;
  color:#bbb;
}

.win-rate{
  display:block;
  font-size:25px;
  line-height:1;
  font-weight:1000;
  color:#ffdc50;
  text-shadow:0 0 8px #ffd84d66;
}

/* =========================
   ランキング
========================= */

.ranking-box{
  margin-top:9px;
  background:linear-gradient(135deg,#12351f,#07190e);
  border:1px solid #4c7655;
  border-radius:10px;
  padding:12px;
  box-shadow:0 5px 17px #0008;
}

.ranking-header{
  display:grid;
  grid-template-columns:55px 1fr 100px;
  padding:7px 5px;
  color:#aebdb1;
  font-size:11px;
  border-bottom:1px solid #315238;
}

.rank-row{
  display:grid;
  grid-template-columns:55px 1fr 100px;
  align-items:center;
  min-height:48px;
  border-bottom:1px solid #203e29;
}

.rank-row:last-child{
  border-bottom:none;
}

.rank-position{
  text-align:center;
  font-size:22px;
  font-weight:1000;
}

.rank-name{
  font-weight:bold;
}

.rank-rate{
  text-align:right;
  color:#ffd84d;
  font-size:20px;
  font-weight:1000;
}

.rank-bar{
  grid-column:2 / 4;
  height:5px;
  background:#06130a;
  border-radius:10px;
  overflow:hidden;
  margin:0 0 7px;
}

.rank-bar-inner{
  height:100%;
  background:linear-gradient(90deg,#b68c24,#ffe77b);
}

/* =========================
   投票
========================= */

.vote-grid{
  margin-top:9px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:7px;
}

.vote-card{
  background:#0b2113;
  border:1px solid #3e6548;
  border-radius:8px;
  padding:9px 5px;
  text-align:center;
}

.vote-name{
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.vote-count{
  margin:5px 0;
  color:#ddd;
  font-size:12px;
}

.vote-button{
  width:100%;
  border:0;
  border-radius:6px;
  padding:8px 3px;
  background:linear-gradient(180deg,#ffe477,#d2a331);
  color:#111;
  font-size:11px;
  font-weight:1000;
  cursor:pointer;
  box-shadow:0 3px 0 #725615;
}

.vote-button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #725615;
}

.vote-button:disabled{
  opacity:.4;
  cursor:not-allowed;
}

.my-vote{
  display:none;
  margin-top:10px;
  text-align:center;
  padding:10px;
  background:#173d22;
  border:1px solid #4f895b;
  border-radius:8px;
  font-weight:bold;
}

.error{
  display:none;
  margin-top:10px;
  padding:11px;
  background:#551c1c;
  border:1px solid #ff6868;
  border-radius:8px;
  color:#ffdada;
  font-size:12px;
  line-height:1.5;
}

.footer{
  text-align:center;
  margin-top:22px;
  color:#78927f;
  font-size:10px;
  line-height:1.7;
}

@media(max-width:700px){

  .logo{
    font-size:31px;
    letter-spacing:2px;
  }

  .horse-board{
    grid-template-columns:repeat(5,150px);
    overflow-x:auto;
    padding-bottom:7px;
  }

  .horse-card{
    width:150px;
  }

  .vote-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .ranking-header,
  .rank-row{
    grid-template-columns:45px 1fr 70px;
  }

  .main{
    padding-left:8px;
    padding-right:8px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="live">
    <span class="live-dot"></span>
    LIVE
  </div>

  <div class="logo">
    DOKKYO RACE
  </div>

  <div class="subtitle">
    学園祭スペシャル・単勝予想
  </div>

  <div class="status" id="firebaseStatus">
    🔄 Firebase接続中...
  </div>

</header>


<main class="main">

  <div class="notice">
    🏇 お金を使わない無料の人気投票です。1端末につき1票まで投票できます。
  </div>


  <!-- 出走馬 -->

  <div class="section-title">
    🏇 出走馬
  </div>

  <div class="horse-board" id="horseBoard"></div>


  <!-- 勝率ランキング -->

  <div class="section-title">
    📊 勝率ランキング
  </div>

  <div class="ranking-box">

    <div class="ranking-header">
      <div>順位</div>
      <div>エントリー</div>
      <div style="text-align:right">勝率</div>
    </div>

    <div id="ranking"></div>

  </div>


  <!-- 投票 -->

  <div class="section-title">
    🎫 みんなの投票
  </div>

  <div class="vote-grid" id="voteGrid"></div>

  <div class="my-vote" id="myVote"></div>

  <div class="error" id="errorBox"></div>


  <div class="footer">
    DOKKYO RACE / SCHOOL FESTIVAL SPECIAL<br>
    ※勝率は演出用の固定表示です。投票結果とは連動しません。
  </div>

</main>


<script>

/* ========================================
   Firebase
======================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDq54jr0rMRmc--F1ZEPqa9cyMbtGmFkUQ",
  authDomain: "sase34-9cebc.firebaseapp.com",
  projectId: "sase34-9cebc",
  storageBucket: "sase34-9cebc.firebasestorage.app",
  messagingSenderId: "507211802803",
  appId: "1:507211802803:web:d804fef0ed4aeded9ba8c6"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* ========================================
   出走馬
======================================== */

const horses = [

  {
    id:"1",
    name:"オレンジスター",
    win:32
  },

  {
    id:"2",
    name:"ロイヤルポニー",
    win:25
  },

  {
    id:"3",
    name:"グリーンフラッシュ",
    win:19
  },

  {
    id:"4",
    name:"ビッくらサンダー",
    win:14
  },

  {
    id:"5",
    name:"アサクサダッシュ",
    win:10
  }

];


let currentUser = null;
let votes = {};
let myVote = null;


/* ========================================
   出走馬カード
======================================== */

function renderHorses(){

  const board =
    document.getElementById("horseBoard");

  board.innerHTML = "";

  horses.forEach(horse => {

    board.innerHTML += `

      <div class="horse-card">

        <div class="horse-number n${horse.id}">
          ${horse.id}
        </div>

        <div class="horse-picture">

          <div class="big-horse">
            <span>🐎</span>
          </div>

        </div>

        <div class="horse-name">
          ${horse.name}
        </div>

        <div class="entry">
          ENTRY No.${horse.id}
        </div>

        <div class="win">

          <span class="win-label">
            勝率
          </span>

          <span class="win-rate">
            ${horse.win}%
          </span>

        </div>

      </div>

    `;

  });

}


/* ========================================
   勝率ランキング
   ※勝率は固定
======================================== */

function renderRanking(){

  const ranking =
    document.getElementById("ranking");

  ranking.innerHTML = "";

  horses.forEach((horse,index) => {

    ranking.innerHTML += `

      <div class="rank-row">

        <div class="rank-position">
          ${index + 1}
        </div>

        <div class="rank-name">
          ${horse.name}
        </div>

        <div class="rank-rate">
          ${horse.win}%
        </div>

        <div class="rank-bar">
          <div
            class="rank-bar-inner"
            style="width:${horse.win}%"
          ></div>
        </div>

      </div>

    `;

  });

}


/* ========================================
   投票ボタン
======================================== */

function renderVoteButtons(){

  const grid =
    document.getElementById("voteGrid");

  grid.innerHTML = "";

  horses.forEach(horse => {

    const count =
      votes[horse.id] || 0;

    grid.innerHTML += `

      <div class="vote-card">

        <div class="vote-name">
          ${horse.id}番 ${horse.name}
        </div>

        <div
          class="vote-count"
          id="vote-${horse.id}"
        >
          投票 ${count}票
        </div>

        <button
          class="vote-button"
          id="button-${horse.id}"
          onclick="vote('${horse.id}')"
        >
          このエントリーを予想
        </button>

      </div>

    `;

  });

  updateButtons();

}


/* ========================================
   投票数更新
======================================== */

function updateVoteCounts(){

  horses.forEach(horse => {

    const el =
      document.getElementById(`vote-${horse.id}`);

    if(el){

      el.textContent =
        `投票 ${votes[horse.id] || 0}票`;

    }

  });

}


/* ========================================
   ボタン状態
======================================== */

function updateButtons(){

  horses.forEach(horse => {

    const button =
      document.getElementById(`button-${horse.id}`);

    if(!button) return;

    if(myVote){

      button.disabled = true;

      if(myVote === horse.id){

        button.textContent =
          "✓ 投票済み";

      }else{

        button.textContent =
          "投票済み";

      }

    }else{

      button.disabled = false;

      button.textContent =
        "このエントリーを予想";

    }

  });

}


/* ========================================
   投票
======================================== */

async function vote(horseId){

  if(!currentUser){

    showError(
      "Firebase認証がまだ完了していません。少し待ってください。"
    );

    return;
  }

  if(myVote){

    alert(
      "この端末ではすでに投票済みです！"
    );

    return;
  }

  try{

    const voteRef =
      db
      .collection("races")
      .doc("festival2026")
      .collection("votes_v2")
      .doc(currentUser.uid);

    await voteRef.set({

      horseId:horseId,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    myVote = horseId;

    updateButtons();

    const horse =
      horses.find(h => h.id === horseId);

    const myVoteEl =
      document.getElementById("myVote");

    myVoteEl.style.display = "block";

    myVoteEl.textContent =
      `🎉 ${horse.name} に投票しました！`;

  }catch(error){

    console.error(error);

    showError(
      "投票できませんでした。Firestore RulesがPublishされているか確認してください。"
    );

  }

}


/* ========================================
   Firebase開始
======================================== */

async function startFirebase(){

  try{

    const status =
      document.getElementById("firebaseStatus");

    status.textContent =
      "🔄 Firebase認証中...";


    if(!auth.currentUser){

      await auth.signInAnonymously();

    }


    currentUser =
      auth.currentUser;


    if(!currentUser){

      throw new Error(
        "匿名ユーザーを取得できませんでした"
      );

    }


    status.textContent =
      "🟢 Firebase ONLINE";

    status.style.color =
      "#7dff9b";


    startVoteListener();


  }catch(error){

    console.error(
      "Firebase Auth Error:",
      error
    );

    const status =
      document.getElementById("firebaseStatus");

    status.textContent =
      "🔴 Firebase接続エラー";

    status.style.color =
      "#ff7777";


    showError(
      "Firebaseに接続できませんでした。Authenticationの匿名ログインとGitHub PagesのAuthorized domainsを確認してください。"
    );

  }

}


/* ========================================
   リアルタイム投票監視
======================================== */

function startVoteListener(){

  db
  .collection("races")
  .doc("festival2026")
  .collection("votes_v2")
  .onSnapshot(

    snapshot => {

      votes = {};

      snapshot.forEach(doc => {

        const data =
          doc.data();

        if(data.horseId){

          votes[data.horseId] =
            (votes[data.horseId] || 0) + 1;

        }

      });


      updateVoteCounts();

    },

    error => {

      console.error(
        "Firestore Error:",
        error
      );

      const status =
        document.getElementById("firebaseStatus");

      status.textContent =
        "🔴 Firestoreエラー";

      status.style.color =
        "#ff7777";


      showError(
        "Firestoreの読み込みに失敗しました。Firestore RulesをPublishしてください。"
      );

    }

  );


  /* 自分の投票確認 */

  db
  .collection("races")
  .doc("festival2026")
  .collection("votes_v2")
  .doc(currentUser.uid)
  .get()

  .then(doc => {

    if(doc.exists){

      const data =
        doc.data();

      myVote =
        data.horseId;

      const horse =
        horses.find(
          h => h.id === myVote
        );

      if(horse){

        const myVoteEl =
          document.getElementById("myVote");

        myVoteEl.style.display =
          "block";

        myVoteEl.textContent =
          `✓ ${horse.name} に投票済みです`;

      }

      updateButtons();

    }

  })

  .catch(error => {

    console.error(
      "Vote check error:",
      error
    );

  });

}


/* ========================================
   エラー
======================================== */

function showError(message){

  const box =
    document.getElementById("errorBox");

  box.style.display =
    "block";

  box.textContent =
    "⚠️ " + message;

}


/* ========================================
   起動
======================================== */

renderHorses();
renderRanking();
renderVoteButtons();
startFirebase();

</script>

</body>
</html>
