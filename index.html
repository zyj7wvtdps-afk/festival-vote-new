<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOKKYO RACE</title>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans JP",sans-serif;
  background:
    radial-gradient(circle at top,#176b38 0,#073b20 42%,#02170c 100%);
  color:white;
  min-height:100vh;
}

.header{
  background:linear-gradient(180deg,#102c1c,#06160d);
  border-bottom:4px solid #d8b34a;
  padding:18px 15px 14px;
  text-align:center;
  box-shadow:0 4px 20px #0008;
}

.live{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:#111;
  border:1px solid #555;
  border-radius:20px;
  padding:5px 12px;
  font-size:12px;
  font-weight:bold;
  margin-bottom:7px;
}

.live-dot{
  width:9px;
  height:9px;
  background:#ff1515;
  border-radius:50%;
  animation:blink 1s infinite;
  box-shadow:0 0 10px red;
}

@keyframes blink{
  0%,45%{opacity:1}
  50%,100%{opacity:.2}
}

.logo{
  font-size:42px;
  font-weight:1000;
  letter-spacing:4px;
  color:#f4d76b;
  text-shadow:
    0 2px 0 #7c5c00,
    0 0 15px #ffd84d88;
}

.subtitle{
  font-size:14px;
  color:#ddd;
  margin-top:3px;
}

.firebase-status{
  display:inline-block;
  margin-top:10px;
  padding:6px 12px;
  border-radius:20px;
  background:#10251a;
  border:1px solid #31563e;
  font-size:12px;
}

.main{
  max-width:900px;
  margin:auto;
  padding:18px 12px 40px;
}

.notice{
  background:linear-gradient(90deg,#7c1e14,#b43b17,#7c1e14);
  border:2px solid #f1bf45;
  border-radius:10px;
  padding:10px;
  text-align:center;
  font-weight:bold;
  box-shadow:0 4px 15px #0007;
  margin-bottom:15px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:linear-gradient(90deg,#182c1e,#0c1b12);
  border-left:5px solid #e1bb4c;
  padding:11px 13px;
  margin-top:15px;
  font-weight:900;
  font-size:18px;
}

.countdown{
  color:#ffdf6a;
  font-size:13px;
}

.card{
  margin-top:10px;
  background:linear-gradient(135deg,#113a22,#092516);
  border:1px solid #487451;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 18px #0008;
}

.horse-row{
  position:relative;
  min-height:135px;
  padding:14px 12px 14px 65px;
  border-bottom:1px solid #31583b;
  overflow:hidden;
}

.horse-row:last-child{
  border-bottom:none;
}

.number{
  position:absolute;
  left:12px;
  top:18px;
  width:38px;
  height:38px;
  border-radius:6px;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:19px;
  font-weight:1000;
  color:#111;
  background:#eee;
  box-shadow:0 2px 5px #0008;
}

.n1{background:#fff}
.n2{background:#111;color:white}
.n3{background:#e33;color:white}
.n4{background:#3d8cff;color:white}
.n5{background:#f4dc3e}

.horse-info{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.name{
  font-size:20px;
  font-weight:1000;
  color:#fff;
}

.entry{
  font-size:11px;
  color:#a9c4ad;
  margin-top:3px;
}

.win-box{
  text-align:right;
  min-width:82px;
}

.win-label{
  display:block;
  color:#d6d6d6;
  font-size:11px;
  font-weight:bold;
}

.win-rate{
  display:block;
  color:#ffd84d;
  font-size:28px;
  font-weight:1000;
  line-height:1.05;
  text-shadow:0 0 10px #ffd84d55;
}

.bar{
  height:8px;
  background:#06140b;
  border-radius:20px;
  overflow:hidden;
  margin-top:12px;
  border:1px solid #31563a;
}

.bar-inner{
  height:100%;
  background:linear-gradient(90deg,#e1b43c,#fff0a1,#e1b43c);
  box-shadow:0 0 10px #e5c24d;
}

.vote-area{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:11px;
  gap:10px;
}

.vote-count{
  color:#c9d8cc;
  font-size:13px;
}

.vote-button{
  border:0;
  border-radius:7px;
  padding:10px 15px;
  font-weight:1000;
  color:#111;
  background:linear-gradient(180deg,#ffe477,#d8a932);
  box-shadow:0 3px 0 #775b18;
  cursor:pointer;
}

.vote-button:active{
  transform:translateY(2px);
  box-shadow:0 1px 0 #775b18;
}

.vote-button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.runner{
  position:absolute;
  bottom:2px;
  left:-80px;
  font-size:42px;
  animation:run 5.5s linear infinite;
  filter:drop-shadow(0 3px 2px #0009);
  pointer-events:none;
}

.runner span{
  display:inline-block;
  transform:scaleX(-1);
}

@keyframes run{
  0%{left:-80px}
  100%{left:calc(100% + 30px)}
}

.runner.delay1{animation-delay:-1.1s}
.runner.delay2{animation-delay:-2.2s}
.runner.delay3{animation-delay:-3.3s}
.runner.delay4{animation-delay:-4.4s}

.ranking{
  margin-top:12px;
  background:#08190e;
  border:1px solid #3c6847;
  border-radius:10px;
  padding:13px;
}

.rank-title{
  font-weight:1000;
  color:#f2d15c;
  margin-bottom:9px;
}

.rank-line{
  display:flex;
  align-items:center;
  gap:9px;
  padding:8px 4px;
  border-bottom:1px solid #193722;
}

.rank-line:last-child{
  border-bottom:none;
}

.rank-no{
  width:25px;
  text-align:center;
  font-weight:1000;
}

.rank-name{
  flex:1;
  font-weight:bold;
}

.rank-votes{
  color:#ddd;
  font-weight:bold;
}

.my-vote{
  margin-top:12px;
  padding:11px;
  text-align:center;
  border-radius:8px;
  background:#173b22;
  border:1px solid #4f8759;
  font-weight:bold;
  display:none;
}

.error{
  background:#541b1b;
  border:1px solid #ff6666;
  color:#ffdada;
  padding:12px;
  border-radius:9px;
  margin-top:10px;
  display:none;
  font-size:13px;
  line-height:1.5;
}

.footer{
  text-align:center;
  color:#8ea995;
  font-size:11px;
  margin-top:25px;
  line-height:1.7;
}

@media(max-width:600px){
  .logo{
    font-size:31px;
    letter-spacing:2px;
  }

  .horse-row{
    min-height:145px;
  }

  .name{
    font-size:17px;
  }

  .win-rate{
    font-size:24px;
  }

  .vote-button{
    padding:9px 11px;
    font-size:12px;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="live">
    <span class="live-dot"></span>
    LIVE
  </div>

  <div class="logo">DOKKYO RACE</div>

  <div class="subtitle">
    学園祭スペシャル・単勝予想
  </div>

  <div class="firebase-status" id="firebaseStatus">
    🔄 Firebase接続中...
  </div>

</header>

<main class="main">

  <div class="notice">
    🏇 お金を使わない無料の人気投票です。1端末につき1票まで投票できます。
  </div>

  <div class="section-title">
    <span>🏆 出走エントリー</span>
    <span class="countdown">LIVE</span>
  </div>

  <div class="card" id="horses"></div>

  <div class="section-title">
    <span>📊 勝率</span>
    <span class="countdown">固定表示</span>
  </div>

  <div class="ranking" id="ranking">
    <div class="rank-title">DOKKYO RACE 勝率</div>
  </div>

  <div class="my-vote" id="myVote"></div>

  <div class="error" id="errorBox"></div>

  <div class="footer">
    DOKKYO RACE / SCHOOL FESTIVAL SPECIAL<br>
    ※勝率は演出用の固定表示です。投票結果とは連動しません。
  </div>

</main>

<script>

/* =========================
   Firebase設定
========================= */

const firebaseConfig = {
  apiKey: "AIzaSyDq54jr0rMRmc--F1ZEPqa9cyMbtGmFkUQ",
  authDomain: "sase34-9cebc.firebaseapp.com",
  projectId: "sase34-9cebc",
  storageBucket: "sase34-9cebc.firebasestorage.app",
  messagingSenderId: "507211802803",
  appId: "1:507211802803:web:d804fef0ed4aeded9ba8c6"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* =========================
   レースデータ
========================= */

const horses = [
  {
    id:"1",
    name:"オレンジスター",
    win:32
  },
  {
    id:"2",
    name:"ロイヤルポニー",
    win:25
  },
  {
    id:"3",
    name:"グリーンフラッシュ",
    win:19
  },
  {
    id:"4",
    name:"ビッくらサンダー",
    win:14
  },
  {
    id:"5",
    name:"アサクサダッシュ",
    win:10
  }
];


/* =========================
   画面要素
========================= */

const horsesEl = document.getElementById("horses");
const rankingEl = document.getElementById("ranking");
const statusEl = document.getElementById("firebaseStatus");
const errorEl = document.getElementById("errorBox");
const myVoteEl = document.getElementById("myVote");

let currentUser = null;
let votes = {};
let myVote = null;


/* =========================
   馬一覧表示
========================= */

function renderHorses(){

  horsesEl.innerHTML = "";

  horses.forEach((horse,index)=>{

    const row = document.createElement("div");

    row.className = "horse-row";

    row.innerHTML = `
      <div class="number n${horse.id}">
        ${horse.id}
      </div>

      <div class="horse-info">

        <div>
          <div class="name">
            ${horse.name}
          </div>

          <div class="entry">
            ENTRY No.${horse.id}
          </div>
        </div>

        <div class="win-box">
          <span class="win-label">勝率</span>
          <span class="win-rate">${horse.win}%</span>
        </div>

      </div>

      <div class="bar">
        <div
          class="bar-inner"
          style="width:${horse.win}%"
        ></div>
      </div>

      <div class="vote-area">

        <div class="vote-count" id="votes-${horse.id}">
          投票 0票
        </div>

        <button
          class="vote-button"
          id="button-${horse.id}"
          onclick="vote('${horse.id}')"
        >
          このエントリーを予想
        </button>

      </div>

      <div class="runner delay${index}">
        <span>🐎</span>
      </div>
    `;

    horsesEl.appendChild(row);

  });

}


/* =========================
   ランキング表示
========================= */

function renderRanking(){

  const sorted = [...horses].sort((a,b)=>{
    return (votes[b.id] || 0) - (votes[a.id] || 0);
  });

  rankingEl.innerHTML = `
    <div class="rank-title">
      DOKKYO RACE 勝率
    </div>
  `;

  sorted.forEach((horse,index)=>{

    const count = votes[horse.id] || 0;

    const line = document.createElement("div");

    line.className = "rank-line";

    line.innerHTML = `
      <div class="rank-no">
        ${index + 1}
      </div>

      <div class="rank-name">
        ${horse.name}
      </div>

      <div class="rank-votes">
        ${count}票
      </div>
    `;

    rankingEl.appendChild(line);

  });

}


/* =========================
   投票数表示
========================= */

function renderVoteCounts(){

  horses.forEach(horse=>{

    const el = document.getElementById(`votes-${horse.id}`);

    if(el){
      el.textContent =
        `投票 ${votes[horse.id] || 0}票`;
    }

  });

}


/* =========================
   ボタン状態
========================= */

function updateButtons(){

  horses.forEach(horse=>{

    const button =
      document.getElementById(`button-${horse.id}`);

    if(!button) return;

    if(myVote){

      button.disabled = true;

      if(myVote === horse.id){

        button.textContent = "✓ 投票済み";

      }else{

        button.textContent = "投票済み";

      }

    }else{

      button.disabled = false;
      button.textContent = "このエントリーを予想";

    }

  });

}


/* =========================
   投票する
========================= */

async function vote(horseId){

  if(!currentUser){

    showError(
      "Firebase認証が完了していません。少し待ってからもう一度お試しください。"
    );

    return;
  }

  if(myVote){

    alert("この端末ではすでに投票済みです！");

    return;
  }

  try{

    const voteRef =
      db.collection("races")
        .doc("festival2026")
        .collection("votes_v2")
        .doc(currentUser.uid);

    await voteRef.set({

      horseId: horseId,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    myVote = horseId;

    updateButtons();

    myVoteEl.style.display = "block";

    const horse =
      horses.find(h => h.id === horseId);

    myVoteEl.textContent =
      `🎉 ${horse.name} に投票しました！`;

  }catch(error){

    console.error(error);

    showError(
      "投票に失敗しました。FirebaseのFirestoreルールが公開されているか確認してください。"
    );

  }

}


/* =========================
   Firebase接続開始
========================= */

async function startFirebase(){

  try{

    statusEl.textContent =
      "🔄 Firebase認証中...";

    /*
      すでにログイン済みなら
      そのユーザーをそのまま使用
    */

    if(!auth.currentUser){

      await auth.signInAnonymously();

    }

    currentUser = auth.currentUser;

    if(!currentUser){

      throw new Error("匿名ユーザーを取得できませんでした");

    }

    statusEl.textContent =
      "🟢 Firebase ONLINE";

    statusEl.style.color = "#7dff9b";

    startVoteListener();

  }catch(error){

    console.error("Firebase Auth Error:",error);

    statusEl.textContent =
      "🔴 Firebase接続エラー";

    statusEl.style.color = "#ff7777";

    showError(
      "Firebaseに接続できませんでした。\
      Firebase Authenticationの「匿名」が有効になっているか、\
      GitHub Pagesのドメインが承認済みか確認してください。"
    );

  }

}


/* =========================
   投票データ監視
========================= */

function startVoteListener(){

  db.collection("races")
    .doc("festival2026")
    .collection("votes_v2")
    .onSnapshot(

      snapshot=>{

        votes = {};

        snapshot.forEach(doc=>{

          const data = doc.data();

          if(data.horseId){

            votes[data.horseId] =
              (votes[data.horseId] || 0) + 1;

          }

        });

        renderVoteCounts();
        renderRanking();

      },

      error=>{

        console.error(
          "Firestore Listener Error:",
          error
        );

        statusEl.textContent =
          "🔴 Firestoreエラー";

        statusEl.style.color = "#ff7777";

        showError(
          "Firestoreの読み込みに失敗しました。Firestore RulesをPublishしてください。"
        );

      }

    );


  /*
    自分がすでに投票しているか確認
  */

  db.collection("races")
    .doc("festival2026")
    .collection("votes_v2")
    .doc(currentUser.uid)
    .get()

    .then(doc=>{

      if(doc.exists){

        const data = doc.data();

        myVote = data.horseId;

        const horse =
          horses.find(h => h.id === myVote);

        if(horse){

          myVoteEl.style.display = "block";

          myVoteEl.textContent =
            `✓ ${horse.name} に投票済みです`;

        }

        updateButtons();

      }

    })

    .catch(error=>{

      console.error(
        "Vote check error:",
        error
      );

    });

}


/* =========================
   エラー表示
========================= */

function showError(message){

  errorEl.style.display = "block";

  errorEl.textContent =
    "⚠️ " + message;

}


/* =========================
   初期化
========================= */

renderHorses();
renderRanking();
startFirebase();

</script>

</body>
</html>
