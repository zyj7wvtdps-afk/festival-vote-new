<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>させ34‼️ | FESTIVAL RACE</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background:
        radial-gradient(circle at top, #176b3a 0%, #062d19 55%, #03180d 100%);
      color: white;
      min-height: 100vh;
    }

    header {
      background: #071f12;
      border-bottom: 4px solid #d6b45a;
      padding: 18px 16px;
      text-align: center;
    }

    .school {
      font-size: 12px;
      letter-spacing: 3px;
      color: #d6b45a;
      font-weight: bold;
    }

    .title {
      font-size: 38px;
      font-weight: 900;
      margin: 5px 0;
    }

    .subtitle {
      font-size: 13px;
      letter-spacing: 4px;
      color: #ddd;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      background: #0b301c;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    nav button {
      border: 1px solid #d6b45a;
      background: #123e25;
      color: white;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    nav button.active {
      background: #d6b45a;
      color: #102415;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 20px 14px 50px;
    }

    .race-board {
      border: 2px solid #d6b45a;
      background: rgba(0,0,0,.35);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
    }

    .race-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      background: linear-gradient(90deg, #123d24, #071c10);
      border-bottom: 1px solid #d6b45a;
    }

    .race-number {
      font-size: 14px;
      color: #d6b45a;
      font-weight: bold;
    }

    .live {
      color: #ff4b4b;
      font-weight: 900;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: .4; }
    }

    .race-name {
      text-align: center;
      padding: 18px;
      font-size: 24px;
      font-weight: 900;
    }

    .track {
      height: 90px;
      margin: 0 14px 18px;
      border-radius: 45px;
      border: 3px solid #d6b45a;
      background:
        repeating-linear-gradient(
          0deg,
          #1d743e 0px,
          #1d743e 12px,
          #176435 12px,
          #176435 24px
        );
      position: relative;
      overflow: hidden;
    }

    .finish {
      position: absolute;
      right: 35px;
      top: 0;
      width: 8px;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        white 0,
        white 10px,
        black 10px,
        black 20px
      );
    }

    .running-horse {
      position: absolute;
      left: -70px;
      top: 22px;
      font-size: 45px;
      animation: run 7s linear infinite;
    }

    @keyframes run {
      from { left: -70px; }
      to { left: calc(100% + 70px); }
    }

    .notice {
      margin: 18px 0;
      padding: 14px;
      border-left: 4px solid #d6b45a;
      background: rgba(255,255,255,.08);
      line-height: 1.7;
      font-size: 13px;
    }

    .status {
      text-align: center;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      background: rgba(255,255,255,.08);
      font-weight: bold;
    }

    .status.ok {
      color: #9ff3b9;
    }

    .status.error {
      color: #ff9c9c;
    }

    .entries {
      display: grid;
      gap: 12px;
    }

    .entry {
      display: grid;
      grid-template-columns: 55px 1fr auto;
      align-items: center;
      gap: 12px;
      padding: 15px;
      background: #0b2b19;
      border: 1px solid #286641;
      border-radius: 10px;
    }

    .number {
      font-size: 21px;
      font-weight: 900;
      color: #d6b45a;
    }

    .horse {
      font-size: 31px;
    }

    .entry-name {
      font-size: 18px;
      font-weight: 900;
    }

    .rate {
      font-size: 12px;
      color: #d6b45a;
      margin-top: 4px;
    }

    .vote-btn {
      background: #d6b45a;
      color: #102415;
      border: none;
      padding: 12px 17px;
      border-radius: 7px;
      font-weight: 900;
      cursor: pointer;
      min-width: 95px;
    }

    .vote-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .vote-btn:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .ranking {
      margin-top: 20px;
    }

    .ranking-item {
      display: grid;
      grid-template-columns: 50px 55px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 14px;
      margin-bottom: 10px;
      background: #0b2b19;
      border: 1px solid #286641;
      border-radius: 9px;
    }

    .rank {
      font-size: 22px;
      font-weight: 900;
      color: #d6b45a;
    }

    .rank-horse {
      font-size: 30px;
    }

    .count {
      font-weight: 900;
      font-size: 18px;
    }

    .small {
      font-size: 12px;
      color: #aaa;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #aaa;
      font-size: 11px;
      letter-spacing: 2px;
    }

    @media (max-width: 600px) {
      .title {
        font-size: 30px;
      }

      .entry {
        grid-template-columns: 45px 1fr;
      }

      .vote-btn {
        grid-column: 1 / -1;
        width: 100%;
      }

      .ranking-item {
        grid-template-columns: 40px 45px 1fr;
      }

      .count {
        grid-column: 3;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="school">SCHOOL FESTIVAL 2026</div>
  <div class="title">🐎 させ34‼️</div>
  <div class="subtitle">SASE34 FESTIVAL RACE</div>
</header>

<nav>
  <button id="voteTab" class="active">🏇 出走表・投票</button>
  <button id="rankingTab">📊 人気ランキング</button>
</nav>

<main>

  <!-- 投票画面 -->
  <section id="voteSection" class="section active">

    <div class="race-board">

      <div class="race-header">
        <div class="race-number">第34回 文化祭記念</div>
        <div class="live">● LIVE</div>
      </div>

      <div class="race-name">
        させ34‼️ スペシャルレース
      </div>

      <div class="track">
        <div class="running-horse">🏇</div>
        <div class="finish"></div>
      </div>

    </div>

    <div class="notice">
      🗳️ あなたが応援したい参加者を<strong>1名</strong>選んで投票してください。<br>
      ※この企画は文化祭内で行う<strong>無料の人気投票</strong>です。
      お金を賭けたり、賞金を受け取ったりするものではありません。
    </div>

    <div id="status" class="status">
      Firebaseに接続しています…
    </div>

    <div id="entries" class="entries"></div>

  </section>

  <!-- ランキング -->
  <section id="rankingSection" class="section">

    <div class="race-board">
      <div class="race-header">
        <div class="race-number">第34回 文化祭記念</div>
        <div class="live">● LIVE</div>
      </div>

      <div class="race-name">
        📊 現在の人気ランキング
      </div>
    </div>

    <div id="ranking" class="ranking"></div>

  </section>

</main>

<footer>
  🐎 SASE34 FESTIVAL 2026<br>
  FREE FESTIVAL VOTE
</footer>

<script>
  /* =========================
     Firebase設定
  ========================= */

  const firebaseConfig = {
    apiKey: "AIzaSyDq54jr0rMRmc--F1ZEPqa9cyMbtGmFkUQ",
    authDomain: "sase34-9cebc.firebaseapp.com",
    projectId: "sase34-9cebc",
    storageBucket: "sase34-9cebc.firebasestorage.app",
    messagingSenderId: "507211802803",
    appId: "1:507211802803:web:d804fef0ed4aeded9ba8c6"
  };

  firebase.initializeApp(firebaseConfig);

  const db = firebase.firestore();


  /* =========================
     5頭の設定
  ========================= */

  const horses = [
    {
      id: "01",
      name: "エントリー1",
      rate: 34
    },
    {
      id: "02",
      name: "エントリー2",
      rate: 15
    },
    {
      id: "03",
      name: "エントリー3",
      rate: 21
    },
    {
      id: "04",
      name: "エントリー4",
      rate: 18
    },
    {
      id: "05",
      name: "エントリー5",
      rate: 30
    }
  ];


  /* =========================
     HTML生成
  ========================= */

  const entries = document.getElementById("entries");

  function renderEntries(votes) {

    entries.innerHTML = "";

    horses.forEach(horse => {

      const count = votes[horse.id] || 0;

      const div = document.createElement("div");

      div.className = "entry";

      div.innerHTML = `
        <div>
          <div class="number">${horse.id}</div>
          <div class="horse">🐎</div>
        </div>

        <div>
          <div class="entry-name">${horse.name}</div>
          <div class="rate">参考表示値：${horse.rate}%</div>
          <div class="small">現在 ${count}票</div>
        </div>

        <button
          class="vote-btn"
          onclick="vote('${horse.id}')"
          ${hasVoted() ? "disabled" : ""}
        >
          🗳️ 投票する
        </button>
      `;

      entries.appendChild(div);
    });
  }


  /* =========================
     Firebaseから票を取得
  ========================= */

  async function loadVotes() {

    try {

      const snapshot = await db
        .collection("votes")
        .get();

      const votes = {};

      horses.forEach(horse => {
        votes[horse.id] = 0;
      });

      snapshot.forEach(doc => {

        const data = doc.data();

        if (data.votes !== undefined) {
          votes[doc.id] = Number(data.votes) || 0;
        }

      });

      renderEntries(votes);
      renderRanking(votes);

      document.getElementById("status").textContent =
        "🟢 投票受付中";

      document.getElementById("status").className =
        "status ok";

    } catch (error) {

      console.error(error);

      document.getElementById("status").textContent =
        "🔴 Firebaseに接続できませんでした";

      document.getElementById("status").className =
        "status error";
    }
  }


  /* =========================
     投票済みチェック
  ========================= */

  function hasVoted() {
    return localStorage.getItem("sase34VoteDone") === "true";
  }


  /* =========================
     投票
  ========================= */

  async function vote(horseId) {

    if (hasVoted()) {
      alert("この端末ではすでに投票しています！");
      return;
    }

    const button = event.target;

    button.disabled = true;
    button.textContent = "送信中…";

    try {

      const ref = db
        .collection("votes")
        .doc(horseId);

      await db.runTransaction(async transaction => {

        const doc = await transaction.get(ref);

        let currentVotes = 0;

        if (doc.exists) {
          currentVotes = Number(doc.data().votes) || 0;
        }

        transaction.set(
          ref,
          {
            votes: currentVotes + 1,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          },
          { merge: true }
        );

      });

      localStorage.setItem("sase34VoteDone", "true");

      alert("🎉 投票しました！");

      await loadVotes();

      showRanking();

    } catch (error) {

      console.error(error);

      alert("投票に失敗しました。もう一度試してください。");

      button.disabled = false;
      button.textContent = "🗳️ 投票する";
    }
  }


  /* =========================
     ランキング表示
  ========================= */

  function renderRanking(votes) {

    const ranking = document.getElementById("ranking");

    const sorted = horses
      .map(horse => ({
        ...horse,
        votes: votes[horse.id] || 0
      }))
      .sort((a, b) => b.votes - a.votes);

    ranking.innerHTML = "";

    sorted.forEach((horse, index) => {

      let medal = "";

      if (index === 0) medal = "🥇";
      if (index === 1) medal = "🥈";
      if (index === 2) medal = "🥉";

      const div = document.createElement("div");

      div.className = "ranking-item";

      div.innerHTML = `
        <div class="rank">
          ${medal || (index + 1)}
        </div>

        <div class="rank-horse">🐎</div>

        <div>
          <strong>${horse.id} ${horse.name}</strong>
          <div class="small">
            参考表示値：${horse.rate}%
          </div>
        </div>

        <div class="count">
          ${horse.votes}票
        </div>
      `;

      ranking.appendChild(div);
    });
  }


  /* =========================
     タブ切り替え
  ========================= */

  const voteTab = document.getElementById("voteTab");
  const rankingTab = document.getElementById("rankingTab");

  const voteSection = document.getElementById("voteSection");
  const rankingSection = document.getElementById("rankingSection");

  voteTab.onclick = () => {

    voteTab.classList.add("active");
    rankingTab.classList.remove("active");

    voteSection.classList.add("active");
    rankingSection.classList.remove("active");

    loadVotes();
  };

  rankingTab.onclick = () => {

    rankingTab.classList.add("active");
    voteTab.classList.remove("active");

    rankingSection.classList.add("active");
    voteSection.classList.remove("active");

    loadVotes();
  };


  function showRanking() {

    rankingTab.click();

  }


  /* =========================
     リアルタイム更新
  ========================= */

  db.collection("votes")
    .onSnapshot(() => {
      loadVotes();
    });


  /* =========================
     起動
  ========================= */

  loadVotes();

</script>

</body>
</html>
